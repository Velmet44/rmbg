name: Feature request
description: Suggest a capability or workflow improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome. Please describe the user problem before prescribing a solution.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Who needs this, and what are they trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: A possible solution or workflow, if you have one.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: What do you do today, if anything?
    validations:
      required: false
